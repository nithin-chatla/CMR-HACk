application:
  name: "ScanSure AI"
  version: "1.3.0-production"
  mode: "offline_first"
  problem_statement: "Develop an offline AI assisted imaging tool that enhances low quality ultrasound videos using denoising and contrast adjustment, then highlights potential cysts or other anomalies using computer vision. The system generates annotated images with confidence scores for remote radiologist review, supporting healthcare workers using affordable ultrasound equipment in resource limited settings."
  disclaimer: "ScanSure AI is an experimental AI-assisted ultrasound image enhancement and analysis tool. It does not provide a medical diagnosis. All findings require review by a qualified radiologist."

target_workstation_profile:
  device_name: "jio-fiber"
  device_id: "BE9BFDC4-649F-4964-BF9A-BEB20207D099"
  product_id: "00342-42708-90880-AAOEM"
  processor: "13th Gen Intel(R) Core(TM) i5-13420H (2.10 GHz)"
  installed_ram_gb: 16.0
  usable_ram_gb: 15.6
  discrete_gpu: "NVIDIA GeForce RTX 3050 6GB Laptop GPU (6 GB)"
  integrated_gpu: "Intel(R) UHD Graphics (128 MB)"
  storage_used_gb: 337.0
  storage_total_gb: 477.0
  storage_free_gb: 140.0
  system_type: "64-bit operating system, x64-based processor"

hardware:
  default_device: "auto"
  fallback_device: "cpu"
  rtx3050_vram_budget_mb: 2560
  max_ram_buffer_mb: 1024
  gpu_frame_batch_size: 16
  cpu_frame_batch_size: 8

enhancement:
  default_method: "speckle_bilateral_clahe"
  available_methods:
    - "speckle_bilateral_clahe"
    - "median_clahe"
    - "nlm_clahe"
    - "clahe_only"
  strength: 0.75
  clahe_clip_limit: 2.2
  clahe_tile_grid: [8, 6]
  gamma: 1.05
  denoise_window_radius: 3
  temporal_alpha: 0.28
  motion_gate_threshold: 18.0

detection:
  enabled: true
  model_name: "ScanSure-UNet-Lite-v1.3-BreastUS"
  model_version: "1.3.0-busi-calibrated"
  supported_anatomy: "Breast Ultrasound (B-Mode Linear Array 5-12 MHz)"
  validated_threshold: 0.55
  uncertain_upper_bound: 0.72
  min_region_area_px: 80
  max_region_area_ratio: 0.30
  temporal_iou_smoothing: true
  temporal_persistence_frames: 2

video:
  supported_formats: [".mp4", ".avi", ".mov", ".mkv"]
  output_codec: "libx264"
  pixel_format: "yuv420p"
  crf: 18
  preserve_audio: true
